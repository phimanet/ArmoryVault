services:
  web:
    image: nginx:alpine
    container_name: ArmoryVault_8186
    restart: unless-stopped
    ports:
      - "8186:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./uploads:/usr/share/nginx/uploads:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api

  api:
    image: python:3.12-alpine
    container_name: ArmoryVault_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./.env:/app/.env:ro
    environment:
      - PORT=5000
    command: python3 /app/server.py
