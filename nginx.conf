server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), payment=(), usb=()" always;

    # Payload Ceiling
    client_max_body_size 25M;

    # Static Web Root
    root /usr/share/nginx/html;
    index index.html;

    # Block public access to sensitive files, dotfiles, scripts, and databases
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(json|env|py|sh|bak|backup)$ {
        deny all;
        return 403;
    }

    location /backups/ {
        deny all;
        return 403;
    }

    # Serve user uploaded photos with caching
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Reverse proxy to backend API microservice
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Main frontend route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
